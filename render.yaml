services:
  ai-engine:
    type: web
    name: raksha-ai-engine
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: PROJECT_NAME
        value: Raksha Citizen Safety Engine
