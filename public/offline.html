<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Offline Emergency Mode | Raksha</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.95rem; margin-bottom: 1.75rem; max-width: 380px; line-height: 1.5; }
    .card {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 1rem;
      padding: 1.25rem;
      width: 100%;
      max-width: 400px;
      text-align: left;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; margin-bottom: 0.75rem; color: #f1f5f9; }
    .btn-call {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: #1e293b;
      color: #ffffff;
      text-decoration: none;
      padding: 0.85rem 1rem;
      border-radius: 0.75rem;
      margin-bottom: 0.6rem;
      font-weight: 600;
      border: 1px solid #334155;
      transition: background 0.2s;
    }
    .btn-call:hover { background: #334155; }
    .btn-call .number { color: #ef4444; font-size: 1.1rem; }
    .btn-retry {
      background: #dc2626;
      color: white;
      border: none;
      padding: 0.85rem 1.75rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 0.75rem;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
    }
    .btn-retry:hover { background: #ef4444; }
  </style>
</head>
<body>
  <div class="badge">
    <span>⚠️</span> Network Offline
  </div>
  <h1>Emergency Telephony Fallback</h1>
  <p>Internet connectivity is currently unavailable. You can still initiate direct cellular emergency calls immediately below:</p>

  <div class="card">
    <h2>Direct Emergency Hotlines</h2>
    <a href="tel:112" class="btn-call">
      <span>Unified Emergency</span>
      <span class="number">📞 112</span>
    </a>
    <a href="tel:100" class="btn-call">
      <span>Police Control Room</span>
      <span class="number">📞 100</span>
    </a>
    <a href="tel:1091" class="btn-call">
      <span>Women Helpline</span>
      <span class="number">📞 1091</span>
    </a>
    <a href="tel:108" class="btn-call">
      <span>Medical Ambulance</span>
      <span class="number">📞 108</span>
    </a>
  </div>

  <button class="btn-retry" onclick="window.location.reload()">
    Check Connection & Retry
  </button>
</body>
</html>
